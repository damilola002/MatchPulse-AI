[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchpulse-sim"
version = "1.0.0"
description = "Deterministic synthetic football match event generator for MatchPulse AI"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matchpulse_sim = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
