[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchpulse-sim"
version = "1.0.0"
description = "Deterministic synthetic football match event generator for MatchPulse AI"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "uvicorn==0.53.0",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matchpulse_sim = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
